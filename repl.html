<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MoneyClicker REPL</title>

</head>
<body>
<script
        src="https://cdn.jsdelivr.net/npm/@electric-sql/pglite-repl/dist-webcomponent/Repl.js"
        type="module"
></script>

<!-- Include the Repl web component in your page -->
<pglite-repl id="repl"></pglite-repl>

<script type="module">
    import {PGlite} from 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js'
    import ddl from './create-tables.sql?raw' //puts it in  a string

    // Create a PGlite instance
    const pg = new PGlite('idb://money-clicker')
    console.log(ddl);
    pg.exec(ddl);
    // Retrieve the Repl element
    const repl = document.getElementById('repl')

    // REPL to your PGlite instance
    repl.pg = pg
</script>
</body>
</html>
